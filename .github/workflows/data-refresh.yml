name: Monthly Data Refresh
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of month, 03:00 UTC
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache geocoding cache (Nominatim/Overpass results)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: geocode-cache-${{ github.run_id }}
          restore-keys: geocode-cache-

      - name: Run data refresh
        run: npm run data:refresh

      # Perf regression guard on freshly regenerated data (M7/M8/M9). Runs
      # report-only while the payloads still exceed the budgets (expected-fail
      # until the data optimization lands); flip continue-on-error to false
      # once check-data-budget.mjs goes green so a bloated re-commit blocks.
      - name: Enforce data payload budgets (M7/M8/M9)
        continue-on-error: true
        run: node scripts/check-data-budget.mjs

      - name: Commit & Push changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@undepescuim.ro"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit"
          else
            git commit -m "data: monthly refresh $(date +%Y-%m-%d)"
            git push
          fi
