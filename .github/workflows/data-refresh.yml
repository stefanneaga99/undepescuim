name: Monthly Data Refresh
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of month, 03:00 UTC
  workflow_dispatch:        # Manual trigger for testing

# Read-only: this job scrapes sources into data/raw/refresh/ and uploads the
# result as an artifact. It never commits to the repository and never writes the
# published data directory (the scraper output shape differs from what the
# frontend reads).
# Promoting refreshed data is a separate, reviewed step.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache geocoding cache (Nominatim/Overpass results)
        uses: actions/cache@v6
        with:
          path: data/cache
          key: geocode-cache-${{ github.run_id }}
          restore-keys: geocode-cache-

      - name: Scrape sources (no publish)
        run: npm run data:refresh

      - name: Upload refresh output
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-${{ github.run_id }}
          path: data/raw/refresh/
          if-no-files-found: warn
          retention-days: 30
