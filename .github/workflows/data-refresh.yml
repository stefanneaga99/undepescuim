name: Monthly Data Refresh
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of month, 03:00 UTC
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data refresh
        run: npm run data:refresh

      - name: Commit & Push changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@undepescuim.ro"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit"
          else
            git commit -m "data: monthly refresh $(date +%Y-%m-%d)"
            git push
          fi
