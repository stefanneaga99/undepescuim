# REM-6 / SEC-07: dependency + data-integrity security gates.
# Triggered on every PR and push to main. See docs/security-test-plan.md §5.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit & static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (prod deps — fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      # All-deps audit is INFORMATIONAL (does not block): dev-only toolchains
      # (e.g. @lhci/cli -> tmp/uuid chain) can carry high advisories that never
      # ship — blocking on them is a false positive (security-test-plan.md §8).
      # Dependabot + dependency-review keep the real supply-chain risk covered.
      - name: npm audit (all deps — informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: XSS sink scan (SEC-06 — no raw-HTML sinks)
        run: |
          if grep -rnE 'dangerouslySetInnerHTML|__html|innerHTML|insertAdjacentHTML|document\.write|new Function|eval\(' src/; then
            echo "::error:: raw-HTML sink found in src/ — refused"
            exit 1
          fi
          echo "PASS: no raw-HTML sinks"

      - name: Data scheme scan (SEC-08 / REM-5)
        run: node scripts/security_data_check.mjs

  deps:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Dependency review only makes sense on PRs.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high