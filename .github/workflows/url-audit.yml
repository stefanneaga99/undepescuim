name: url-audit
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet -r requirements-dev.txt
      - name: Run reviewed live link validation
        run: python3 scripts/link_validation.py --mode live --report data/processed/link_validation_report.json --repairs data/processed/link_validation_repairs.jsonl --fail-on none
      - uses: actions/upload-artifact@v4
        with:
          name: link-validation-${{ github.run_id }}
          path: |
            data/processed/link_validation_report.json
            data/processed/link_validation_repairs.jsonl
          if-no-files-found: error
