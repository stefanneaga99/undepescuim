# Playwright E2E — docs/e2e-test-plan.md §7.
# Build and browser setup happen once; independent Playwright projects then run
# concurrently against that isolated server. The target wall-clock budget is <25m.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_PORT: '3000'
  CI: 'true'
  PLAYWRIGHT_RUN_ID: ${{ github.run_id }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build, start one server, and run projects in parallel
        env:
          E2E_SERVER_READY: 'true'
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts/test-results ci-artifacts/reports ci-artifacts/logs
          started=$(date +%s)
          npm run build > ci-artifacts/build.log 2>&1
          build_status=$?
          printf 'build_duration_seconds=%s exit_code=%s\n' "$(( $(date +%s) - started ))" "$build_status" | tee -a ci-artifacts/build.log
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi

          PORT="$E2E_PORT" npm run start > ci-artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${E2E_PORT}/" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ci-artifacts/server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "E2E server did not become ready within 120 seconds"
            cat ci-artifacts/server.log
            exit 1
          fi

          pids=()
          names=(mobile tablet desktop data)
          run_project() {
            name="$1"
            project_started=$(date +%s)
            {
              printf 'project=%s started_at=%s\n' "$name" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              timeout --signal=TERM --kill-after=30s 18m \
                npx playwright test --project="$name" --workers=2 --reporter=line
              status=$?
              printf 'project=%s duration_seconds=%s exit_code=%s\n' "$name" "$(( $(date +%s) - project_started ))" "$status"
              exit "$status"
            } >"ci-artifacts/logs/${name}.log" 2>&1 &
            pids+=("$!")
          }

          for name in "${names[@]}"; do
            PLAYWRIGHT_OUTPUT_DIR="ci-artifacts/test-results/${name}" \
            PLAYWRIGHT_REPORT_DIR="ci-artifacts/reports/${name}" \
            run_project "$name"
          done

          failed=0
          for index in "${!pids[@]}"; do
            if wait "${pids[$index]}"; then
              :
            else
              status=$?
              printf 'project=%s failed exit_code=%s\n' "${names[$index]}" "$status"
              failed=1
            fi
          done
          printf 'parallel_projects=%s failed_projects=%s target_budget_minutes=25\n' "${#names[@]}" "$failed"
          exit "$failed"

      - name: Upload Playwright diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7
