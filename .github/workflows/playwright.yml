# Playwright E2E — docs/e2e-test-plan.md §7.
# The seeded suite and the fixture-backed @data river contract probes run on
# every pull request, main push, and scheduled/manual invocation.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly data-contract sweep (catches upstream data regressions)
    - cron: '17 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build & run E2E (isolated seeded + offline data projects)
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
