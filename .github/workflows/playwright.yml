# Playwright E2E — docs/e2e-test-plan.md §7.
# Runs the full seeded suite (all 3 viewports) on PR + main; the real-data
# contract tier (@data) only on main / nightly / manual (it loads the 38 MB
# waters.json and is not needed on every PR).
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly data-contract sweep (catches upstream data regressions)
    - cron: '17 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build & run E2E (logic + flows, seeded data)
        run: npx playwright test --grep-invert @data
        env:
          CI: 'true'

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real-data contract tier — main / schedule / manual only, not every PR.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Data-contract tests (real data)
        run: npx playwright test --grep @data
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-data-report
          path: playwright-report/
          retention-days: 7