# REM-6: Dependabot — weekly npm + GitHub Actions updates for
# neagastefan99/undepescuim (public repo). See docs/security-test-plan.md §5.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      nextjs:
        patterns: ['next', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5